name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The pi devDependencies pin the compile baseline POST-migration (0.84.2), so the `build`
  # job above is what guards the modelRegistry -> modelRuntime world: PR #152's
  # isolated-provider test (test/e2e/isolated-provider.e2e.test.ts) skips itself on
  # pre-migration Pi and now actually runs there.
  #
  # This job covers the other end: the earliest Pi the peerDependencies claim (`>=0.80.0`;
  # 0.80.1 is the earliest published release satisfying it). It is NOT continue-on-error —
  # a green run here is the only evidence behind that range, and if the floor genuinely
  # can't be supported any more, the peer range is what should change.
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@0.80.1 @earendil-works/pi-ai@0.80.1 @earendil-works/pi-tui@0.80.1
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npx vitest run --reporter=dot

  # Forward canary: reinstall whatever Pi is `latest` over the pin, so a release newer than
  # the baseline surfaces here before it reaches users. It runs the full typecheck + suite,
  # not a hand-picked file list, so new drift can't hide in a test nobody remembered to add
  # here. Both steps pass as of the 0.84.2 baseline — a failure IS fresh breakage.
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
